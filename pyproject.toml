[project]
name = "knowledge-factory-fyi"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.4",
]

[project.optional-dependencies]
transform = [
    "dbt-core>=1.12.7",
    "dbt-duckdb>=1.11.1",
    "dbt-metricflow>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]  # asserts in tests; SQL built from validated identifiers only

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
