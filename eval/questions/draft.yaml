# ── WIDE: products 1–5 and specialties 1–6 stored as columns ────────────────
- id: q012
  split: dev
  persona: journalist
  difficulty: filtered
  traps: [WIDE]
  question: >-
    What was the total value of PY2024 general payments associated with Ozempic?
  answer: {usd: number}
  expert_note: >-
    A product can appear in any of the 5 product-name columns. A record counts in full if any
    slot matches 'OZEMPIC' (case-insensitive); CMS doesn't split amounts across products.
  sources: [general]

- id: q013
  split: dev
  persona: market
  difficulty: multistep
  traps: [WIDE, ENTITY]
  question: >-
    Which 10 drugs or biologicals had the highest total PY2025 general payments associated with them?
  answer: {ranked: [{product: str, usd: number}], k: 10}
  expert_note: >-
    Unpivot all 5 slots and keep only slots indicated as Drug or Biological. A record counts in
    full toward every product it lists, so the products sum to more than the total. Product
    names are upper-cased and trimmed.
  sources: [general]

