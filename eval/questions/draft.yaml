# ── PAGE: questions where API paging or truncation breaks naive agents ──────
- id: q040
  split: dev
  persona: journalist
  difficulty: multistep
  traps: [PAGE, GRAIN]
  question: >-
    How many physicians in California received more than $10,000 in total general payments in PY2025?
  answer: {count: int}
  expert_note: >-
    Needs a per-physician total over millions of records. Through the API (500 rows per page)
    this only works by using CMS's pre-aggregated "payments grouped by covered recipient"
    dataset. State = Recipient_State.
  sources: [general]

