# DRAFT eval questions. Not frozen yet.
#
# Status: candidates only. Before the eval-v1 tag:
#   1. Write eval/gold_sql/qNNN.sql for each question, against BRONZE.
#   2. Resolve every `verify:` item against the loaded data.
#   3. Split into dev.yaml (30) and holdout.yaml (20). The curator must never read holdout.yaml.
#   4. Ideally, have one domain expert review a sample of ~15 questions.
#
# Field guide
#   split        dev | holdout. Stratified so every trap tag has 2+ held-out questions.
#   persona      compliance | journalist | policy | coi (hospital conflict-of-interest) | market (market access)
#   difficulty   lookup | filtered | multistep | adversarial
#   traps        first tag = primary (used for stratification); see PLAN.md §4
#   answer       shape the agent must return; the grader compares against gold SQL output
#   expert_note  the definition the gold answer uses, and why. This is what makes the answer
#                key defensible; agents never see it.
#   sources      general | research | ownership | nppes | part_d | seed:<name>
#
# Conventions used by every expert_note unless stated otherwise
#   - "Physicians" = Covered_Recipient_Type 'Covered Recipient Physician'. NPPs and
#     teaching hospitals are excluded.
#   - "Payments" (count) = records, which is what CMS's published payment counts use.
#   - Companies are grouped by Applicable_Manufacturer_or_Applicable_GPO_Making_Payment_ID,
#     not by name.
#   - A person is identified by Covered_Recipient_Profile_ID (NPI can be blank).
#   - Program year (PY) = Program_Year, not Date_of_Payment, unless the question names dates.
#   - Only the latest publication of each program year counts.

questions:

# ── GRAIN: records vs individual payments vs distinct recipients ─────────────
- id: q001
  split: dev
  persona: compliance
  difficulty: filtered
  traps: [GRAIN, ENTITY]
  question: >-
    How many general payment records did Novo Nordisk report to physicians in PY2025,
    and how many distinct physicians received at least one?
  answer: {records: int, distinct_physicians: int}
  expert_note: >-
    Two different counts. Novo Nordisk = its making-payment ID(s) as listed in
    seed:manufacturer_family. A physician who received 40 records counts once.
  sources: [general, seed:manufacturer_family]

- id: q002
  split: dev
  persona: policy
  difficulty: filtered
  traps: [GRAIN]
  question: >-
    What was the median total general payment per physician in PY2024, among physicians
    who received anything?
  answer: {usd: number}
  expert_note: >-
    Add up each physician's total first, then take the median across physicians.
    The median of individual records is a different (and wrong) answer.
  sources: [general]

- id: q003
  split: dev
  persona: journalist
  difficulty: multistep
  traps: [GRAIN]
  question: >-
    What share of all PY2025 general payment dollars to physicians went to the top 1% of
    physicians by total amount received?
  answer: {percent: number}
  expert_note: >-
    Rank physicians by their total. Top 1% = ceil(0.01 × number of paid physicians).
    Dollars = their sum ÷ the total to all paid physicians.
  sources: [general]

- id: q004
  split: dev
  persona: compliance
  difficulty: filtered
  traps: [GRAIN]
  question: >-
    What was the average value of a single food and beverage transfer to a physician in PY2024?
  answer: {usd: number}
  expert_note: >-
    One record can bundle several transfers (Number_of_Payments_Included_in_Total_Amount).
    Average per transfer = sum(amount) ÷ sum(number of payments), not the average record amount.
  sources: [general]

- id: q005
  split: holdout
  persona: policy
  difficulty: filtered
  traps: [GRAIN, RTYPE, TAXON]
  question: >-
    How many distinct nurse practitioners received at least one general payment in PY2025?
  answer: {count: int}
  expert_note: >-
    NPP records cover several professions. Nurse practitioners are identified by primary
    type (Covered_Recipient_Primary_Type_1). Count distinct profile IDs.
  verify: [exact primary-type label for nurse practitioners in PY2025 data]
  sources: [general]

- id: q006
  split: holdout
  persona: journalist
  difficulty: filtered
  traps: [GRAIN]
  question: >-
    What was the average total general payment per physician who received payments,
    for each of PY2023, PY2024 and PY2025?
  answer: {table: [{program_year: int, usd: number}]}
  expert_note: >-
    Per year: total dollars ÷ distinct paid physicians. Average per record is wrong.
  sources: [general]

# ── REPUB: republication, Change_Type, latest-publication-only ───────────────
- id: q007
  split: dev
  persona: compliance
  difficulty: filtered
  traps: [REPUB]
  question: >-
    How many PY2024 general payment records were changed or added in the current publication,
    compared with the previous one?
  answer: {changed: int, added: int}
  expert_note: >-
    Uses Change_Type in the current publication. The dictionary enum is NEW/ADD/CHANGED/UNCHANGED,
    while the description text says "ADDED". Gold SQL uses the enum values.
  verify: [CMS definition of NEW vs ADD in the methodology document]
  sources: [general]

